[project]
name = "gpu-goblin"
version = "0.1.0"
description = "An AI agent that hunts wasted compute on AMD MI300X"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "huggingface_hub>=0.28",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "sentence-transformers>=2.7",
  "numpy>=1.26",
  "sse-starlette>=2.0",
  "streamlit>=1.32",
  "altair>=5.2",
  "pandas>=2.2",
  "requests>=2.31",
  "openai>=1.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]
# Workload-execution stack — only needed when goblin_runner.sh actually runs
# workloads/train_qwen_lora.py on an MI300X. The official ROCm/PyTorch
# containers (rocm/pytorch, rocm/vllm) ship torch+rocm preinstalled, so
# this extra is for bare environments that need to hand-install the
# training-script dependencies. `torch` is intentionally NOT pinned: the
# ROCm wheel tag (e.g. `2.3.0+rocm6.1`) is environment-specific and
# overspecifying it here would conflict with the container's preinstalled
# version. `bitsandbytes` is deliberately omitted — the bnb scenario is
# supposed to fail on ROCm; that's the bug it demonstrates.
runtime = [
  "torch",
  "transformers>=4.40",
  "datasets>=2.16",
  "peft>=0.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "runner*", "ui*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
